<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImmerSpace-重力實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="gravity.css">
</head>

<body>

    <!-- UI Overlay -->
    <div class="fixed inset-0 pointer-events-none z-10 flex flex-col justify-between p-8">

        <!-- Header -->
        <div class="flex justify-between items-start">
            <div class="glass-panel p-6 rounded-[2rem] flex items-center gap-8">
                <button onclick="window.history.back()"
                    class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/10 pointer-events-auto transition">
                    <i class="fas fa-arrow-left text-sm"></i>
                </button>
                <div>
                    <div class="text-xs tracking-[0.5em] text-blue-500 font-black uppercase mb-0.5">Gravity Lab</div>
                    <div class="text-2xl font-black italic tracking-tighter text-white">重力實驗室</div>
                </div>
            </div>

            <!-- Real-time Stats -->
            <div class="glass-panel p-6 rounded-[2rem] min-w-[280px]">
                <div class="grid grid-cols-3 gap-4 text-center">
                    <div>
                        <div class="text-[10px] text-gray-500 uppercase mb-1">射程 (Range)</div>
                        <div id="stat-range" class="text-xl font-black data-monitor text-blue-400">0.0m</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-gray-500 uppercase mb-1">高度 (Apogee)</div>
                        <div id="stat-height" class="text-xl font-black data-monitor text-emerald-400">0.0m</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-gray-500 uppercase mb-1">重力 (G)</div>
                        <div id="stat-g" class="text-xl font-black data-monitor text-white">1.00</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Left Controls: Launch Parameters -->
        <div class="absolute left-8 top-1/2 -translate-y-1/2 flex flex-col gap-6 pointer-events-auto">
            <div class="glass-panel p-8 rounded-[3rem] w-72 flex flex-col gap-8">
                <div
                    class="text-xs font-black text-blue-500 uppercase tracking-widest border-b border-white/10 pb-4 italic">
                    <i class="fas fa-sliders-h mr-2"></i> 發射參數調節
                </div>

                <!-- Angle -->
                <div class="space-y-4">
                    <div class="flex justify-between items-end">
                        <label class="text-xs font-bold text-gray-400 uppercase">發射角度 (°)</label>
                        <input type="number" id="num-angle" value="45" min="0" max="90"
                            class="w-16 bg-transparent border-b border-blue-500/50 text-sm font-black text-blue-400 text-right focus:outline-none focus:border-blue-500 custom-number-input"
                            oninput="syncInput('angle', 'num')">
                    </div>
                    <input type="range" id="input-angle" min="0" max="90" value="45"
                        oninput="syncInput('angle', 'range')">
                </div>

                <!-- Force -->
                <div class="space-y-4">
                    <div class="flex justify-between items-end">
                        <label class="text-xs font-bold text-gray-400 uppercase">初始初速 (m/s)</label>
                        <input type="number" id="num-force" value="20" min="5" max="100"
                            class="w-16 bg-transparent border-b border-blue-500/50 text-sm font-black text-blue-400 text-right focus:outline-none focus:border-blue-500 custom-number-input"
                            oninput="syncInput('force', 'num')">
                    </div>
                    <input type="range" id="input-force" min="5" max="100" value="20"
                        oninput="syncInput('force', 'range')">
                </div>

                <!-- Mass -->
                <div class="space-y-4">
                    <div class="flex justify-between items-end">
                        <label class="text-xs font-bold text-gray-400 uppercase">物體質量 (kg)</label>
                        <input type="number" id="num-mass" value="1.0" min="0.1" max="100" step="0.1"
                            class="w-16 bg-transparent border-b border-blue-500/50 text-sm font-black text-blue-400 text-right focus:outline-none focus:border-blue-500 custom-number-input"
                            oninput="syncInput('mass', 'num')">
                    </div>
                    <input type="range" id="input-mass" min="0.1" max="100" step="0.1" value="1.0"
                        oninput="syncInput('mass', 'range')">
                </div>

                <button onclick="launchProjectile()"
                    class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl text-xs font-black tracking-[0.4em] uppercase transition shadow-lg shadow-blue-900/30">
                    <i class="fas fa-rocket mr-2"></i> 點火發射
                </button>
            </div>
        </div>

        <!-- Right: Planet Selection -->
        <div class="absolute right-8 top-1/2 -translate-y-1/2 flex flex-col gap-4 pointer-events-auto h-[70vh]">
            <div
                class="glass-panel p-4 rounded-[3rem] flex flex-col gap-3 h-full overflow-y-auto custom-scrollbar pt-6 pb-6">
                <!-- Sun -->
                <button onclick="setEnv('sun')" id="btn-sun"
                    class="planet-selector w-16 h-20 shrink-0 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <i class="fas fa-sun text-yellow-500 text-xl"></i>
                    <span class="text-[10px] font-bold">太陽</span>
                </button>
                <button onclick="setEnv('mercury')" id="btn-mercury"
                    class="planet-selector w-16 h-20 shrink-0 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <i class="fas fa-circle text-gray-400 text-xl"></i>
                    <span class="text-[10px] font-bold">水星</span>
                </button>
                <button onclick="setEnv('venus')" id="btn-venus"
                    class="planet-selector w-16 h-20 shrink-0 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <i class="fas fa-circle text-orange-300 text-xl"></i>
                    <span class="text-[10px] font-bold">金星</span>
                </button>
                <button onclick="setEnv('earth')" id="btn-earth"
                    class="planet-selector w-16 h-20 shrink-0 rounded-2xl flex flex-col items-center justify-center gap-2 active">
                    <i class="fas fa-globe text-blue-500 text-xl"></i>
                    <span class="text-[10px] font-bold">地球</span>
                </button>
                <button onclick="setEnv('moon')" id="btn-moon"
                    class="planet-selector w-16 h-20 shrink-0 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <i class="fas fa-moon text-gray-300 text-xl"></i>
                    <span class="text-[10px] font-bold">月球</span>
                </button>
                <button onclick="setEnv('mars')" id="btn-mars"
                    class="planet-selector w-16 h-20 shrink-0 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <i class="fas fa-circle text-orange-500 text-xl"></i>
                    <span class="text-[10px] font-bold">火星</span>
                </button>
                <button onclick="setEnv('jupiter')" id="btn-jupiter"
                    class="planet-selector w-16 h-20 shrink-0 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <i class="fas fa-circle text-yellow-600 text-xl"></i>
                    <span class="text-[10px] font-bold">木星</span>
                </button>
                <button onclick="setEnv('saturn')" id="btn-saturn"
                    class="planet-selector w-16 h-20 shrink-0 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <i class="fas fa-ring text-yellow-200 text-xl"></i>
                    <span class="text-[10px] font-bold">土星</span>
                </button>
                <button onclick="setEnv('uranus')" id="btn-uranus"
                    class="planet-selector w-16 h-20 shrink-0 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <i class="fas fa-circle text-cyan-300 text-xl"></i>
                    <span class="text-[10px] font-bold">天王星</span>
                </button>
                <button onclick="setEnv('neptune')" id="btn-neptune"
                    class="planet-selector w-16 h-20 shrink-0 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <i class="fas fa-circle text-blue-700 text-xl"></i>
                    <span class="text-[10px] font-bold">海王星</span>
                </button>
                <button onclick="setEnv('pluto')" id="btn-pluto"
                    class="planet-selector w-16 h-20 shrink-0 rounded-2xl flex flex-col items-center justify-center gap-2">
                    <i class="fas fa-circle text-gray-500 text-xl"></i>
                    <span class="text-[10px] font-bold">冥王星</span>
                </button>
            </div>
        </div>

        <!-- Bottom Stats & Status -->
        <div class="flex justify-between items-end">
            <div class="glass-panel px-10 py-4 rounded-full border-blue-500/20">
                <div class="text-xs font-black tracking-[0.6em] text-white/30 uppercase italic">
                    Simulation Ready: <span id="status-text" class="text-blue-500 ml-2">已就緒 - 等待點火</span>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-3xl border-blue-500/20 active-scan pointer-events-auto">
                <div class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-2">衝擊力預測 (Impact)</div>
                <div id="impact-value" class="text-2xl font-mono text-white">0.00 kN</div>
            </div>
        </div>
    </div>

    <script src="gravity.js"></script>
</body>

</html>
